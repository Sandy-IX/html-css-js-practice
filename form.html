<!DOCTYPE html>
<html lang="en">
<head>
    <title>Form</title>
    <h1>Form</h1>
    <hr>
</head>

<body>
    <form action="index.php" method="Post" enctype="multipart/form-data">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Your name" minlength="4" maxlength="16" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Your password" minlength="8" maxlength="16" required>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Your email" required>
        <br>
        <label for="number>"> Phone Number:</label>
        <input type="tel" id="number" placeholder="Your number" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"required>
        <br>
        <label for="date">Date:</label>
        <input type="date" id="date" required>
        <br>
        <label for="quantity"></label>Quantity:</label>
        <input type="number" id="quantity" placeholder="Your quantity" min="1" max="100" required value="1">
        <br>
        <label for="title">Title:</label>
        <label for="Mr.">Mr.</label>
        <input type="radio" id="Mr." value="Mr." name="title">
        <label for="Mr.">Ms.</label>
        <input type="radio" id="Ms." value="Ms." name="title">
        <label for="Mr.">PhD.</label>
        <input type="radio" id="PhD." value="PhD." name="title">
        <br>
        <label for="payment">Payment Method:</label>
        <select id="payment" name="payment">
            <option value="credit card">Credit Card</option>
            <option value="paypal">Paypal</option>
            <option value="bank transfer">Bank Transfer</option>
            <option value="giftcard">Gift Card</option>
        </select>
        <br>
        <label for="subscribe">Subscribe to Newsletter:</label>
        <input type="checkbox" id="Subscribe">
        <br>
        <label for="comment">Comment:</label>
        <textarea id="comment" rows="3" cols="25">  </textarea>
        <br>
        <label for="file">Upload File:</label>
        <input type="file" id="file" accept="image/png, image/jpeg">
        <br>
    </form>
</body>
